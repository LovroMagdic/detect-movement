services:
  redis:
    image: redis:7
    container_name: detect-motion-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: detect-motion-api
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RQ_QUEUE_NAME=detect-motion
      - DATABASE_URL=sqlite:////app/backend/database/app.db
      - SQLITE_JOURNAL_MODE=WAL
      - UPLOAD_TEMP_ROOT=/app/backend/uploads-temp
    ports:
      - "8000:8000"
    volumes:
      - ./backend/database:/app/backend/database
      - ./backend/uploads-temp:/app/backend/uploads-temp
    user: "0:0"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: detect-motion-worker
    command: ["rq", "worker", "detect-motion"]
    working_dir: /app/backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RQ_QUEUE_NAME=detect-motion
      - DATABASE_URL=sqlite:////app/backend/database/app.db
      - SQLITE_JOURNAL_MODE=WAL
      - UPLOAD_TEMP_ROOT=/app/backend/uploads-temp
    volumes:
      - ./backend/database:/app/backend/database
      - ./backend/uploads-temp:/app/backend/uploads-temp
    user: "0:0"
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: detect-motion-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

